name: Build Ultimate GD Toolkit Android64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          cli: latest
          path: ./
          build-config: Release
          use-lto: false

      - name: Upload Geode
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-GD-Toolkit-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
