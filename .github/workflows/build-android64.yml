name: Build Ultimate GD Toolkit
'on':
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-24.04
steps:
- uses: actions/checkout@v4

  - uses: geode-sdk/build-geode-mod@main
    with:
      target: Android64
      sdk: given
      cli: latest
      path: ./
      build-config: Release
      use-lto: false
