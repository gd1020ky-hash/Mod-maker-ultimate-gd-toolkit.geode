name: Build Ultimate GD Toolkit

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android64
runs-on: ubuntu-24.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Build Geode mod
    id: build
    uses: geode-sdk/build-geode-mod@main
    with:
      target: Android64
      sdk: given
      cli: latest
      path: ./
      build-config: Release
      use-lto: false
      # Leave android-ndk-version unset.
      # The official action selects the runner's NDK
      # and installs Ninja automatically.

  - name: Upload Geode artifact
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Ultimate-GD-Toolkit-Android64
      path: ${{ steps.build.outputs.build-output }}
      if-no-files-found: error
