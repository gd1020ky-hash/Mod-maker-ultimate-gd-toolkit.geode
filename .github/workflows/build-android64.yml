name: Build Ultimate GD Toolkit Android64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          ninja --version

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          cli: latest
          path: ./
          build-config: Release
          use-lto: false
          android-ndk-version: "26.0.10792818"

      - name: Upload Geode
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-GD-Toolkit-Android64-v0.2.0
          path: ${{ steps.build.outputs.build-output }}/*.geode
          
